<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Seenline</title>
  <desc id="description">Document-to-Markdown for AI pipelines, with hidden content brought to light. A terminal shows visible budget text and a separate hidden-content block.</desc>
  <rect width="1280" height="640" fill="#1b1f27"/>
  <g transform="translate(80 66)">
    <rect width="80" height="80" rx="17.5" fill="#f4f5f7"/>
    <rect x="15" y="17.5" width="50" height="10" rx="5" fill="#1b1f27"/>
    <rect x="15" y="35" width="35" height="10" rx="5" fill="#1b1f27"/>
    <rect x="15" y="52.5" width="50" height="10" rx="5" fill="#f5a524"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f4f5f7">
    <text x="184" y="129" font-size="68" font-weight="700" letter-spacing="-2">Seenline</text>
    <text x="80" y="210" font-size="32">Document-to-Markdown for AI pipelines,</text>
    <text x="80" y="252" font-size="32">with hidden content brought to light.</text>
  </g>
  <rect x="80" y="302" width="1120" height="268" rx="16" fill="#161a21" stroke="#414854"/>
  <path d="M80 352H1200" stroke="#414854"/>
  <g fill="#737c8c">
    <circle cx="106" cy="327" r="5"/>
    <circle cx="126" cy="327" r="5"/>
    <circle cx="146" cy="327" r="5"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="23" fill="#f4f5f7">
    <text x="110" y="395"><tspan fill="#f5a524">$</tspan> seenline clipped.pdf</text>
    <text x="110" y="433" fill="#aab2c0">[p. 1]</text>
    <text x="110" y="471">Approved budget: EUR 100,000 for 2027.</text>
    <text x="110" y="509" fill="#f5a524">[Hidden in the original]</text>
    <text x="110" y="547">p. 1, clipped text: 50 characters not shown</text>
  </g>
</svg>
