# Copy to .github/workflows/ in your repository. Fails a pull request that adds or changes a document holding
# hidden text that reads like an instruction to an AI (exit 4). Use --fail-on-hidden instead to fail on any
# hidden content; expect it to flag ordinary files too (metadata, tiny or clipped text).
name: check documents
on:
  pull_request:
    paths: ["**/*.pdf", "**/*.docx", "**/*.pptx", "**/*.xlsx", "**/*.html", "**/*.eml"]
jobs:
  seenline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Flag hidden instructions in changed documents
        run: |
          git diff -z --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- \
            '*.pdf' '*.docx' '*.pptx' '*.xlsx' '*.html' '*.eml' |
            xargs -0 -r npx -y seenline --json --fail-on-suspect --
